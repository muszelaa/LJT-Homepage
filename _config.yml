# ------------------------------------------------------------------------------
# Site settings
# ------------------------------------------------------------------------------

title: Junteng Liu
first_name: Junteng
last_name: Liu
email: jliugi@connect.ust.hk
description: > # the ">" symbol means to convert all line breaks to space
  Junteng Liu's homepage - first-year PhD candidate at HKUST NLP Group,
  researching natural language processing and machine learning.
footer_text: >
  Powered by <a href="https://jekyllrb.com/" target="_blank">Jekyll</a> with <a href="https://github.com/academicpages/academicpages.github.io">Academic Pages</a> theme.
  Hosted by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a>.
keywords: Junteng Liu, natural language processing, machine learning, HKUST
lang: en # the language of your site, e.g. en, pt-br
icon: /images/favicon.svg # the paths to the favicon
logo: # the paths to the logo, can be an array of paths (JPG, JPEG, PNG, ICO only)

breadcrumb:
  enabled: true # default true, set to false to disable breadcrumb
  root: "Home" # default "Home"
  seperator: "/" # default "/"
  before_item: "<span>" # default "<span>"
  after_item: "</span>" # default "</span>"

last_updated:
  enabled: true # default true, set to false to disable last updated
  text: "Last updated:" # default "Last updated:"

# GitHub repo information, used for the "View on GitHub" link and edit links.
github_repo: "muszelaa/LJT-Homepage"
github_branch: "master"
github_domain: "github.com"

# The base hostname & protocol for your site
url: "https://muszelaa.github.io"
# The subpath of your site
baseurl: "/LJT-Homepage"

# ------------------------------------------------------------------------------
# Jekyll
# ------------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-coffeescript
  - jekyll-default-layout
  - jekyll-titles-from-headings

# Pagination
paginate: 5
paginate_path: "/page:num/"

# Permalinks
permalink: /:year/:month/:day/:title/

# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - files
  - "*.sql"
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Compression
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# ------------------------------------------------------------------------------
# Collections
# ------------------------------------------------------------------------------
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: publication
      share: true
  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: false
      share: true
  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      share: true

# ------------------------------------------------------------------------------
# Site Author
# ------------------------------------------------------------------------------
author:
  name: "Junteng Liu"
  avatar: "/images/bio-photo.jpg"
  bio: "First-year PhD candidate at HKUST NLP Group."
  location: "Hong Kong"
  email: "jliugi@connect.ust.hk"
  description: "First-year PhD candidate at HKUST NLP Group, researching natural language processing and machine learning."
  github: "Vicent0205"
  github_username: "Vicent0205"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  twitter: "junteng88716710"
  twitter_username: "junteng88716710"

# ------------------------------------------------------------------------------
# Site Footer
# ------------------------------------------------------------------------------
footer:
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:jliugi@connect.ust.hk"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/Vicent0205"
    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - label: "X (Twitter)"
      icon: "fab fa-fw fa-x-twitter"
      url: "https://x.com/junteng88716710"
